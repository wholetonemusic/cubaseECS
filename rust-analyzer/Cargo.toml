[package]
name = "cubase-analyzer"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
name = "cubase_analyzer"
crate-type = ["cdylib", "rlib"]

[dependencies]
vst3 = "=0.3.0"
rustfft = "=6.2.0"
num-complex = "=0.4.6"
num-traits = "=0.2.19"
memmap2 = "=0.9.4"
shared_memory = "=0.12.4"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
