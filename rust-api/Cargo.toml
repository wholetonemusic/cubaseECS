[package]
name = "cubase-ecs-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.41.1", features = ["full"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
anyhow = "=1.0.86"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
tower-http = { version = "=0.5.2", features = ["cors", "trace"] }
time = "=0.3.36"
midir = { version = "0.9", optional = true }

[features]
default = []
host-midi = ["dep:midir"]
